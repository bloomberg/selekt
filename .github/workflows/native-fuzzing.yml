name: 'Native Fuzzing'

on:
  workflow_call:
    inputs:
      profile:
        description: 'Fuzzing duration profile'
        required: false
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      profile:
        description: 'Fuzzing duration profile'
        required: true
        type: choice
        options: [scheduled, release]
        default: scheduled
  schedule:
    - cron: '0 3 * * SUN'

permissions: read-all

jobs:
  fuzz:
    name: '${{ matrix.engine }} / ${{ matrix.architecture }} / ASan+UBSan'
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.profile == 'release') && '["libfuzzer","afl"]' || '["libfuzzer"]') }}
        architecture: [x86-64, aarch64]
        include:
          - architecture: x86-64
            os: ubuntu-latest
            cache_arch: amd64
          - architecture: aarch64
            os: ubuntu-24.04-arm
            cache_arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      FUZZ_PROFILE: ${{ inputs.profile || github.event.inputs.profile || (github.event_name == 'schedule' && 'scheduled') || 'smoke' }}

    steps:
      - name: 'Install fuzzing toolchain'
        run: |
          packages=(clang cmake ninja-build make tcl python3 perl gnupg)
          if [[ '${{ matrix.engine }}' == 'afl' ]]; then
            packages+=(afl++)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: 'Setup Java 17'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - name: 'Setup Android SDK (AArch64 stub)'
        if: matrix.architecture == 'aarch64'
        run: |
          mkdir -p "$HOME/.android/sdk/platforms" "$HOME/.android/sdk/build-tools" "$HOME/.android/sdk/licenses"
          echo "" > "$HOME/.android/sdk/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$HOME/.android/sdk/licenses/android-sdk-license"
          echo "" > "$HOME/.android/sdk/licenses/android-sdk-preview-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$HOME/.android/sdk/licenses/android-sdk-preview-license"
          echo "" > "$HOME/.android/sdk/licenses/android-sdk-arm-dbt-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$HOME/.android/sdk/licenses/android-sdk-arm-dbt-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$HOME/.android/sdk/licenses/android-sdk-arm-dbt-license"
          echo "ANDROID_HOME=$HOME/.android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> "$GITHUB_ENV"

      - name: 'Cache Gradle'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: native-fuzz-gradle-${{ matrix.cache_arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            native-fuzz-gradle-${{ matrix.cache_arch }}-

      - name: 'Cache OpenSSL'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: OpenSSL/build
          key: native-fuzz-openssl-${{ matrix.cache_arch }}-${{ hashFiles('OpenSSL/openssl.properties', 'OpenSSL/build.gradle.kts', 'OpenSSL/build_libraries.sh') }}

      - name: 'Build and run fuzzing campaign'
        run: >-
          ./gradlew :SQLite3:nativeFuzz
          -Pselekt.fuzz.engine='${{ matrix.engine }}'
          -Pselekt.fuzz.profile="$FUZZ_PROFILE"

      - name: 'Archive native crashers'
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fuzz-${{ matrix.engine }}-${{ matrix.cache_arch }}-failures
          path: SQLite3/.cxx-fuzz-${{ matrix.engine }}/artifacts
          if-no-files-found: ignore
          retention-days: 14
