name: 'Publication'

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-release-commit:
    name: 'Verify release commit belongs to main'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout protected main branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 'Verify release ancestry'
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          .github/scripts/verify-release-commit.sh "$RELEASE_COMMIT" refs/remotes/origin/main

  native-fuzzing:
    name: 'Native fuzzing release gate / Linux'
    needs: verify-release-commit
    uses: ./.github/workflows/native-fuzzing.yml
    with:
      profile: release

  jvm-fuzzing:
    name: 'JVM fuzzing release gate / Linux'
    needs: verify-release-commit
    uses: ./.github/workflows/jvm-fuzzing.yml
    with:
      profile: release

  build-native-jars:
    name: 'Build Native JARs / ${{ matrix.display }}'
    needs: verify-release-commit
    strategy:
      matrix:
        include:
          - display: 'linux-amd64 (vec1+avx2)'
            os: ubuntu-latest
            platform: linux-amd64
            container: registry.access.redhat.com/ubi8/ubi@sha256:bd097b288df365aec7bad694c87036534ce94d1a4974c943f417f757f8eb2ac4
            shell: bash
            vec1_enabled: 'ON'
            vec1_x86_avx2: 'ON'
          - display: 'linux-aarch64 (vec1)'
            os: ubuntu-24.04-arm
            platform: linux-aarch64
            container: registry.access.redhat.com/ubi8/ubi@sha256:bd097b288df365aec7bad694c87036534ce94d1a4974c943f417f757f8eb2ac4
            shell: bash
            vec1_enabled: 'ON'
            vec1_x86_avx2: 'OFF'
          - display: 'linux-amd64-musl (vec1+avx2)'
            os: ubuntu-latest
            platform: linux-amd64-musl
            container: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
            shell: sh
            vec1_enabled: 'ON'
            vec1_x86_avx2: 'ON'
          - display: 'darwin-aarch64 (vec1)'
            os: macos-15
            platform: darwin-aarch64
            shell: bash
            vec1_enabled: 'ON'
            vec1_x86_avx2: 'OFF'
          - display: 'windows-amd64 (vec1+avx2)'
            os: windows-latest
            platform: windows-amd64
            shell: bash
            vec1_enabled: 'ON'
            vec1_x86_avx2: 'ON'
          - display: 'windows-aarch64 (vec1)'
            os: windows-11-arm
            platform: windows-aarch64
            shell: bash
            vec1_enabled: 'ON'
            vec1_x86_avx2: 'OFF'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 60
    env:
      SELEKT_LIBC: ${{ contains(matrix.platform, 'musl') && 'musl' || '' }}

    steps:
      - name: 'Install system packages'
        shell: sh
        run: |
          # Release toolchains fail closed when repository metadata changes. Review the image digest,
          # metadata checksums, and exact package versions together when intentionally updating them.
          if [ "${{ runner.os }}" = "Linux" ]; then
            if command -v apk > /dev/null 2>&1; then
              case "$(uname -m)" in
                x86_64)
                  MAIN_INDEX_SHA256='0efcc0b0838bcce24a677896864b6535a4a5586d64358027048ddc387ffe2b4e'
                  COMMUNITY_INDEX_SHA256='815ef15704e3ec3a47688bb339d0b2c1dc674827f3025db2dd41e16de19468a9'
                  ;;
                aarch64)
                  MAIN_INDEX_SHA256='917a81a37b0e1c8315009482a56f54d3213c32b0756100bf2ed2b9ebeb342273'
                  COMMUNITY_INDEX_SHA256='56b890b2394c5c19a4ceb54958fa144d6fdc6c108549224c0a268ea98b46ec87'
                  ;;
                *) echo "Unsupported Alpine architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              apk update
              sha256sum /var/cache/apk/APKINDEX.*.tar.gz > /tmp/alpine-indexes.sha256
              grep -q "^$MAIN_INDEX_SHA256  " /tmp/alpine-indexes.sha256
              grep -q "^$COMMUNITY_INDEX_SHA256  " /tmp/alpine-indexes.sha256
              apk add \
                bash=5.2.26-r0 \
                git=2.45.4-r0 \
                gcc=13.2.1_git20240309-r1 \
                g++=13.2.1_git20240309-r1 \
                musl-dev=1.2.5-r4 \
                make=4.4.1-r2 \
                curl=8.14.1-r2 \
                tar=1.35-r2 \
                sed=4.9-r2 \
                gnupg=2.4.9-r0 \
                file=5.45-r1 \
                perl=5.38.5-r0 \
                linux-headers=6.6-r0 \
                cmake=3.29.3-r0 \
                diffutils=3.10-r0 \
                tcl=8.6.14-r1 \
                unzip=6.0-r14 \
                openjdk17=17.0.16_p8-r0
            else
              case "$(uname -m)" in
                x86_64)
                  BASEOS_REPOMD_SHA256='2abeb6c4b0989fd9a655ef108de1e544b2cd8d020c0558148f56d9eafbb4227d'
                  APPSTREAM_REPOMD_SHA256='b301f37a27185aad0c5e30a60a8fc1dfc75dc2c385528426f425fac0aaab7976'
                  CODEREADY_REPOMD_SHA256='06672266bd0a91158ceae4afe470e58799a1482d39264b9325d948da8643aa91'
                  PERL_NEVRA='perl-5.32.1-475.module+el8.10.0+24767+f69b15b5'
                  ;;
                aarch64)
                  BASEOS_REPOMD_SHA256='d8a99e11cd30a1b444209f35115c2effa730bfd037527156c86f1df9b3c2493d'
                  APPSTREAM_REPOMD_SHA256='c776a7b424db0bd132fe8252311ffea909f413e412e61bb15883adb51359edf0'
                  CODEREADY_REPOMD_SHA256='9901974e1b6bc8b9ae7c81eefdd09d42688f602c3db675d4bf194752dabc6edf'
                  PERL_NEVRA='perl-5.26.3-423.el8_10.1'
                  ;;
                *) echo "Unsupported UBI architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              dnf makecache --refresh
              find /var/cache/dnf -path '*/repodata/repomd.xml' -exec sha256sum {} + > /tmp/ubi-repomd.sha256
              grep -q "^$BASEOS_REPOMD_SHA256  " /tmp/ubi-repomd.sha256
              grep -q "^$APPSTREAM_REPOMD_SHA256  " /tmp/ubi-repomd.sha256
              grep -q "^$CODEREADY_REPOMD_SHA256  " /tmp/ubi-repomd.sha256
              dnf install -y --setopt=install_weak_deps=False --setopt=metadata_expire=never \
                git-2.43.7-1.el8_10 \
                gcc-8.5.0-29.el8_10 \
                gcc-c++-8.5.0-29.el8_10 \
                clang-21.1.8-1.module+el8.10.0+23969+c061985f \
                llvm-21.1.8-1.module+el8.10.0+23969+c061985f \
                compiler-rt-21.1.8-1.module+el8.10.0+23969+c061985f \
                libstdc++-static-8.5.0-29.el8_10 \
                glibc-devel-2.28-251.el8_10.48 \
                make-4.2.1-11.el8 \
                curl-7.61.1-34.el8_10.13 \
                tar-1.30-13.el8_10 \
                sed-4.5-5.el8_10 \
                bash-4.4.20-6.el8_10 \
                gnupg2-2.2.20-4.el8_10 \
                file-5.33-27.el8_10 \
                "$PERL_NEVRA" \
                kernel-headers-4.18.0-553.177.1.el8_10 \
                cmake-3.26.5-2.el8 \
                diffutils-3.6-6.el8 \
                tcl-8.6.8-2.el8 \
                unzip-6.0-48.el8_10
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install make tcl-tk
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if [ "${{ runner.arch }}" = "ARM64" ]; then
              choco install ninja --version=1.13.2 -y --no-progress --require-checksums
              choco install magicsplat-tcl-tk --version=2.0.6 -y --no-progress --require-checksums
            else
              choco install mingw --version=16.1.0 -y --no-progress --require-checksums
              choco install make --version=4.4.1 -y --no-progress --require-checksums
              choco install magicsplat-tcl-tk --version=2.0.6 -y --no-progress --require-checksums
            fi
          fi

      - name: 'Configure Windows Perl'
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman --noconfirm -S perl make"
          C:\msys64\usr\bin\bash.exe -lc "echo | cpan Locale::Maketext::Simple Pod::Usage"
          C:\msys64\usr\bin\bash.exe -lc "perl -e 'use Locale::Maketext::Simple; use Pod::Usage; print qq{OK\n}'"

      - name: 'Configure Windows ARM64 Perl'
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          choco install strawberryperl --version=5.42.3.1 -y --no-progress --require-checksums
          $strawberry = 'C:\Strawberry\perl\bin'
          $strawberryC = 'C:\Strawberry\c\bin'
          $strawberrySite = 'C:\Strawberry\perl\site\bin'
          if (-not (Test-Path "$strawberry\perl.exe")) {
            throw "Strawberry Perl install missing: $strawberry\perl.exe not found"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $strawberry
          Add-Content -Path $env:GITHUB_PATH -Value $strawberryC
          Add-Content -Path $env:GITHUB_PATH -Value $strawberrySite
          & "$strawberry\perl.exe" -e "use Locale::Maketext::Simple; use Pod::Usage; print qq{OK\n}"

      - name: 'Setup MSVC'
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: 'Build mimalloc'
        if: runner.os == 'Linux'
        run: |
          cd /tmp
          curl -L https://github.com/microsoft/mimalloc/archive/refs/tags/v3.3.2.tar.gz -o mimalloc.tar.gz
          echo "ca02384e007f46950598500dfaebde5ff9948c1d231f5a81b058799afa64bbbb  mimalloc.tar.gz" | sha256sum -c -
          tar xzf mimalloc.tar.gz
          cd mimalloc-3.3.2
          mkdir -p out/release
          cd out/release
          cmake ../.. -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_SHARED=OFF -DMI_BUILD_STATIC=ON -DMI_BUILD_TESTS=OFF -DMI_LOCAL_DYNAMIC_TLS=ON
          make -j$(nproc) mimalloc-static
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO mkdir -p /usr/local/lib /usr/local/include
          STATIC_LIB=""
          for candidate in libmimalloc.a libmimalloc-static.a; do
            if [ -f "$candidate" ]; then STATIC_LIB="$candidate"; break; fi
          done
          if [ -z "$STATIC_LIB" ]; then
            echo "ERROR: no mimalloc static lib produced. Build dir contents:"
            ls -la
            exit 1
          fi
          $SUDO cp "$STATIC_LIB" /usr/local/lib/libmimalloc.a
          $SUDO cp ../../include/mimalloc.h /usr/local/include/mimalloc.h

      - name: 'Setup Java 17'
        if: "!contains(matrix.platform, 'musl')"
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: ${{ (runner.os == 'Windows' && runner.arch == 'ARM64') && 'microsoft' || 'temurin' }}
          java-version: 17

      - name: 'Set JAVA_HOME'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            if command -v apk > /dev/null 2>&1; then
              echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk" >> $GITHUB_ENV
            elif [ "$(uname -m)" = "aarch64" ]; then
              echo "JAVA_HOME=$JAVA_HOME_17_AARCH64" >> $GITHUB_ENV
            else
              echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if [ "${{ runner.arch }}" = "ARM64" ]; then
              echo "JAVA_HOME=${JAVA_HOME//\\//}" >> $GITHUB_ENV
            else
              echo "JAVA_HOME=${JAVA_HOME_17_X64//\\//}" >> $GITHUB_ENV
            fi
          fi

      - name: 'Setup Android SDK'
        if: "!contains(matrix.platform, 'linux-aarch64') && !contains(matrix.platform, 'musl') && matrix.platform != 'windows-aarch64'"
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools

      - name: 'Setup Android SDK (aarch64)'
        if: matrix.platform == 'linux-aarch64'
        run: |
          mkdir -p "$HOME/.android/sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          echo "2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip" | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/.android/sdk/cmdline-tools"
          mv "$HOME/.android/sdk/cmdline-tools/cmdline-tools" "$HOME/.android/sdk/cmdline-tools/latest"
          yes | "$HOME/.android/sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> $GITHUB_ENV

      - name: 'Setup Android SDK (musl)'
        if: contains(matrix.platform, 'musl')
        run: |
          mkdir -p "$HOME/.android/sdk/platforms" "$HOME/.android/sdk/build-tools" "$HOME/.android/sdk/licenses"
          echo "" > "$HOME/.android/sdk/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$HOME/.android/sdk/licenses/android-sdk-license"
          echo "" > "$HOME/.android/sdk/licenses/android-sdk-preview-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$HOME/.android/sdk/licenses/android-sdk-preview-license"
          echo "" > "$HOME/.android/sdk/licenses/android-sdk-arm-dbt-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$HOME/.android/sdk/licenses/android-sdk-arm-dbt-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$HOME/.android/sdk/licenses/android-sdk-arm-dbt-license"
          echo "ANDROID_HOME=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> $GITHUB_ENV

      - name: 'Setup Android SDK (windows-aarch64 stub)'
        if: matrix.platform == 'windows-aarch64'
        shell: bash
        run: |
          SDK_DIR="$USERPROFILE/.android/sdk"
          SDK_DIR_UNIX=$(echo "$SDK_DIR" | sed 's#\\#/#g')
          mkdir -p "$SDK_DIR_UNIX/platforms" "$SDK_DIR_UNIX/build-tools" "$SDK_DIR_UNIX/licenses"
          {
            echo ""
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee"
          } > "$SDK_DIR_UNIX/licenses/android-sdk-license"
          {
            echo ""
            echo "84831b9409646a918e30573bab4c9c91346d8abd"
          } > "$SDK_DIR_UNIX/licenses/android-sdk-preview-license"
          {
            echo ""
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee"
          } > "$SDK_DIR_UNIX/licenses/android-sdk-arm-dbt-license"
          echo "ANDROID_HOME=$SDK_DIR_UNIX" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR_UNIX" >> $GITHUB_ENV

      - name: 'Checkout'
        run: |
          git config --global --add safe.directory /__w/selekt/selekt
          git clone --depth 2 --recurse-submodules https://github.com/${{ github.repository }} .
          git checkout ${{ github.sha }}

      - name: 'Configure Git'
        if: runner.os == 'Linux'
        run: |
          git config --global --add safe.directory /__w/selekt/selekt

      - name: 'Configure Gradle'
        run: |
          echo 'org.gradle.caching=false' >> gradle.properties
          echo 'org.gradle.configuration-cache=false' >> gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties

      - name: 'Build'
        env:
          LDFLAGS: '-s'
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '12.0' || '' }}
          SELEKT_ENABLE_VEC1: ${{ matrix.vec1_enabled }}
          SELEKT_VEC1_ENABLE_X86_AVX2: ${{ matrix.vec1_x86_avx2 }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CC=clang
            export CXX=clang++
            export SELEKT_SQLITE_HOST_PGO=ON
          elif [ "${{ runner.os }}" = "Linux" ] && [ -z "$SELEKT_LIBC" ]; then
            export CC=clang
            export CXX=clang++
            export SELEKT_SQLITE_HOST_PGO=ON
          elif [ "${{ runner.os }}" = "Linux" ]; then
            export CC=gcc
            export CXX=g++
          elif [ "${{ runner.os }}" = "Windows" ] && [ "${{ runner.arch }}" = "ARM64" ]; then
            export STRAWBERRY_PERL='C:/Strawberry/perl/bin/perl.exe'
            export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:$PATH"
            which perl
            perl -e 'use Locale::Maketext::Simple; use Pod::Usage; print qq{Strawberry perl OK\n}'
          fi
          ./gradlew :selekt-sqlite3-sqlcipher:jar

      - name: 'Verify native library'
        run: |
          LIB=$(find SQLite3/build/intermediates/libs \( -name 'libselekt.*' -o -name 'selekt.dll' \) -type f | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: No native library found in build output."
            exit 1
          fi
          echo "Found native library: $LIB"
          file "$LIB"
          ABS_LIB=$(cd "$(dirname "$LIB")" && pwd)/$(basename "$LIB")
          cat > /tmp/LoadTest.java << 'JAVA'
          public class LoadTest {
              public static void main(String[] args) {
                  System.load(args[0]);
                  System.out.println("OK: Native library loaded successfully.");
              }
          }
          JAVA
          java /tmp/LoadTest.java "$ABS_LIB"

      - name: 'Upload native JAR'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: selekt-sqlcipher-${{ matrix.platform }}
          path: selekt-sqlite3-sqlcipher/build/libs/*.jar

  build-native-jar-musl-aarch64:
    name: 'Build Native JARs (linux-aarch64-musl)'
    needs: verify-release-commit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: 'Build in Alpine container'
        run: |
          # Keep this digest and the checked package-index snapshots in sync with build-native-jars.
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SELEKT_LIBC=musl \
            -e SELEKT_ENABLE_VEC1=ON \
            -e SELEKT_VEC1_ENABLE_X86_AVX2=OFF \
            -e CC=gcc \
            -e CXX=g++ \
            -e LDFLAGS='-s' \
            alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc sh -c '
              set -e
              apk update
              sha256sum /var/cache/apk/APKINDEX.*.tar.gz > /tmp/alpine-indexes.sha256
              grep -q "^917a81a37b0e1c8315009482a56f54d3213c32b0756100bf2ed2b9ebeb342273  " /tmp/alpine-indexes.sha256
              grep -q "^56b890b2394c5c19a4ceb54958fa144d6fdc6c108549224c0a268ea98b46ec87  " /tmp/alpine-indexes.sha256
              apk add \
                bash=5.2.26-r0 \
                git=2.45.4-r0 \
                gcc=13.2.1_git20240309-r1 \
                g++=13.2.1_git20240309-r1 \
                musl-dev=1.2.5-r4 \
                make=4.4.1-r2 \
                curl=8.14.1-r2 \
                tar=1.35-r2 \
                sed=4.9-r2 \
                gnupg=2.4.9-r0 \
                file=5.45-r1 \
                perl=5.38.5-r0 \
                linux-headers=6.6-r0 \
                cmake=3.29.3-r0 \
                diffutils=3.10-r0 \
                tcl=8.6.14-r1 \
                unzip=6.0-r14 \
                openjdk17=17.0.16_p8-r0

              # Build mimalloc
              cd /tmp
              curl -L https://github.com/microsoft/mimalloc/archive/refs/tags/v3.3.2.tar.gz -o mimalloc.tar.gz
              echo "ca02384e007f46950598500dfaebde5ff9948c1d231f5a81b058799afa64bbbb  mimalloc.tar.gz" | sha256sum -c -
              tar xzf mimalloc.tar.gz
              cd mimalloc-3.3.2
              mkdir -p out/release
              cd out/release
              cmake ../.. -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_SHARED=OFF -DMI_BUILD_STATIC=ON -DMI_BUILD_TESTS=OFF -DMI_LOCAL_DYNAMIC_TLS=ON
              make -j$(nproc) mimalloc-static
              mkdir -p /usr/local/lib /usr/local/include
              STATIC_LIB=""
              for candidate in libmimalloc.a libmimalloc-static.a; do
                if [ -f "$candidate" ]; then STATIC_LIB="$candidate"; break; fi
              done
              if [ -z "$STATIC_LIB" ]; then
                echo "ERROR: no mimalloc static lib produced. Build dir contents:"
                ls -la
                exit 1
              fi
              cp "$STATIC_LIB" /usr/local/lib/libmimalloc.a
              cp ../../include/mimalloc.h /usr/local/include/mimalloc.h

              # Configure and build
              cd /workspace
              git config --global --add safe.directory /workspace
              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
              export ANDROID_HOME="$HOME/.android/sdk"
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
              mkdir -p "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/licenses"
              echo "" > "$ANDROID_HOME/licenses/android-sdk-license"
              echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
              echo "" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
              echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
              echo "" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
              echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
              echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"

              echo "org.gradle.caching=false" >> gradle.properties
              echo "org.gradle.configuration-cache=false" >> gradle.properties
              echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
              if [ "${{ github.event_name }}" = "release" ]; then
                ./gradlew -Prelease :selekt-sqlite3-sqlcipher:jar
              fi

              # Verify native library loads
              LIB=$(find SQLite3/build/intermediates/libs -name "libselekt.*" -type f | head -1)
              echo "Found native library: $LIB"
              file "$LIB"
              ABS_LIB=$(cd "$(dirname "$LIB")" && pwd)/$(basename "$LIB")
              cat > /tmp/LoadTest.java << 'JAVA'
              public class LoadTest {
                  public static void main(String[] args) {
                      System.load(args[0]);
                      System.out.println("OK: Native library loaded successfully.");
                  }
              }
              JAVA
              java /tmp/LoadTest.java "$ABS_LIB"
            '

      - name: 'Upload native JAR'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: selekt-sqlcipher-linux-aarch64-musl
          path: selekt-sqlite3-sqlcipher/build/libs/*.jar

  publish-native:
    name: Publish native artifact to Central Portal
    runs-on: ubuntu-latest
    needs: [verify-release-commit, build-native-jars, build-native-jar-musl-aarch64, native-fuzzing, jvm-fuzzing]
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read

    steps:
      - name: 'Install system packages'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc make sed tcl

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: 'Setup Java 17'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 17

      - name: 'Set JAVA_HOME'
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> $GITHUB_ENV
          fi

      - name: 'Configure Gradle'
        run: |
          echo 'org.gradle.caching=false' >> gradle.properties
          echo 'org.gradle.configuration-cache=false' >> gradle.properties

      - name: 'Download all native JARs'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: selekt-sqlcipher-*
          path: selekt-sqlite3-sqlcipher/build/artifacts
          merge-multiple: false

      - name: 'Prepare JARs for publication'
        run: |
          mkdir -p selekt-sqlite3-sqlcipher/build/libs
          find selekt-sqlite3-sqlcipher/build/artifacts -name '*.jar' -exec mv {} selekt-sqlite3-sqlcipher/build/libs/ \;
          echo "JARs ready for publication:"
          ls -la selekt-sqlite3-sqlcipher/build/libs/

      - name: 'Build uber JAR'
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ./gradlew -Prelease :selekt-sqlite3-sqlcipher:uberJar
          fi
          echo "Uber JAR contents:"
          jar tf selekt-sqlite3-sqlcipher/build/libs/selekt-sqlite3-sqlcipher-*.jar | grep jni/ | head -20

      - name: 'Publish to Central Portal'
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_KEY_PASSPHRASE }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
        run: |
          ./gradlew \
            -Prelease \
            -PnativePublication \
            publishAggregationToCentralPortal \
            -x jar

  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    needs: [verify-release-commit, native-fuzzing, jvm-fuzzing]
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    env:
      SELEKT_ENABLE_VEC1: 'ON'
      SELEKT_VEC1_ENABLE_X86_AVX2: 'ON'

    steps:
      - name: 'Install system packages'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc make sed tcl

      - name: 'Cache mimalloc'
        id: cache-mimalloc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /usr/local/lib/libmimalloc.a
            /usr/local/include/mimalloc.h
          key: mimalloc-publish-linux-amd64-v3.3.2

      - name: 'Build mimalloc'
        if: steps.cache-mimalloc.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -L https://github.com/microsoft/mimalloc/archive/refs/tags/v3.3.2.tar.gz -o mimalloc.tar.gz
          echo "ca02384e007f46950598500dfaebde5ff9948c1d231f5a81b058799afa64bbbb  mimalloc.tar.gz" | sha256sum -c -
          tar xzf mimalloc.tar.gz
          cd mimalloc-3.3.2
          mkdir -p out/release
          cd out/release
          cmake ../.. -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_SHARED=OFF -DMI_BUILD_STATIC=ON -DMI_BUILD_TESTS=OFF -DMI_LOCAL_DYNAMIC_TLS=ON
          make -j$(nproc) mimalloc-static
          sudo mkdir -p /usr/local/lib /usr/local/include
          STATIC_LIB=""
          for candidate in libmimalloc.a libmimalloc-static.a; do
            if [ -f "$candidate" ]; then STATIC_LIB="$candidate"; break; fi
          done
          if [ -z "$STATIC_LIB" ]; then
            echo "ERROR: no mimalloc static lib produced. Build dir contents:"
            ls -la
            exit 1
          fi
          sudo cp "$STATIC_LIB" /usr/local/lib/libmimalloc.a
          sudo cp ../../include/mimalloc.h /usr/local/include/mimalloc.h

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: 'Setup Java 11'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 11

      - name: 'Setup Java 17'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 17

      - name: 'Setup Java 25'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - name: 'Set JAVA_HOME'
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> $GITHUB_ENV
          fi

      - name: 'Configure Gradle'
        run: |
          echo 'org.gradle.caching=false' >> gradle.properties
          echo 'org.gradle.configuration-cache=false' >> gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          echo 'selekt.sqlite.pgo=OFF' >> gradle.properties

      - name: 'Unit tests'
        run: ./gradlew :selekt-android:testDebugUnitTest :selekt-java:test :selekt-jdbc:test :selekt-jdbc:testJava25 :selekt-sqlite3-classes:test :selekt-sqlite3-classes:testJava25 :selekt-common:test -x integrationTest ${{ env.SCAN }}

      - name: 'Build Selekt Android'
        run: |
          ./gradlew clean \
            :OpenSSL:assembleArm64-v8a \
            :OpenSSL:assembleArmeabi-v7a \
            :OpenSSL:assembleX86 \
            :OpenSSL:assembleX86_64
          ./gradlew :SQLite3:amalgamate
          ./gradlew assembleRelease

      - name: 'Build Selekt JVM'
        run: |
          ./gradlew :selekt-jdbc:jar :selekt-jvm:jar ${{ env.SCAN }}

      - name: 'Generate repository CycloneDX SBOM'
        run: ./gradlew :repositoryCyclonedxBom --no-configuration-cache

      - name: 'Upload SBOM to GitHub release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            build/reports/cyclonedx/selekt-*.cdx.json \
            --clobber

      - name: 'Publish release to Central Portal'
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_KEY_PASSPHRASE }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
        run: |
          ./gradlew \
            -Prelease \
            publishAggregationToCentralPortal
