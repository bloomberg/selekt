name: 'Publish Documentation'

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  pipeline:
    name: 'GitHub Pages'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: 'Set current year'
        run: echo "YEAR=$(date +'%Y')" >> $GITHUB_ENV
      - name: 'Install system packages'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc make sed tcl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.8
      - run: pip install mkdocs-material==9.7.7
      - name: 'Gradle'
        run: |
          echo 'org.gradle.caching=false' >> gradle.properties
          echo 'org.gradle.configuration-cache=false' >> gradle.properties
      - name: 'Dokka'
        run: |
          ./gradlew dokkaGeneratePublicationHtml
          mkdir -p docs/kdoc
          cp -R build/dokka/html/* docs/kdoc/
      - name: 'Set version'
        run: echo "VERSION=$(grep -hnr '^version=' gradle.properties | sed 's/.*=//')" >> $GITHUB_ENV
      - name: 'Mkdocs'
        run: |
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages -- benchmarks/ 2>/dev/null && cp -r benchmarks docs/ || true
          sed -i 's/<year>/${{ env.YEAR }}/g' docs/*.md
          sed -i 's/<year>/${{ env.YEAR }}/g' mkdocs.yml
          sed -i 's/{selektVersion}/${{ env.VERSION }}/g' docs/*.md
          mkdocs gh-deploy -m 'Automatic mkdocs deployment.'
