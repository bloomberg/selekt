name: 'JVM Fuzzing'

on:
  workflow_call:
    inputs:
      profile:
        description: 'Fuzzing duration profile'
        required: false
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      profile:
        description: 'Fuzzing duration profile'
        required: true
        type: choice
        options: [scheduled, release]
        default: scheduled
  schedule:
    - cron: '0 4 * * SUN'

permissions:
  contents: read

jobs:
  fuzz:
    name: 'Jazzer / Linux'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZ_PROFILE: ${{ inputs.profile || github.event.inputs.profile || (github.event_name == 'schedule' && 'scheduled') || 'smoke' }}

    steps:
      - name: 'Install build dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake gcc g++ make perl sed tcl gnupg

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: 'Setup Java 17'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 17

      - name: 'Setup Java 25'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 25

      - name: 'Use Java 17 for Gradle'
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: 'Cache Gradle'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: jvm-fuzz-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            jvm-fuzz-gradle-

      - name: 'Cache mimalloc'
        id: cache-mimalloc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /usr/local/lib/libmimalloc.a
            /usr/local/include/mimalloc.h
          key: mimalloc-jvm-fuzz-linux-amd64-v3.3.2

      - name: 'Build mimalloc'
        if: steps.cache-mimalloc.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/microsoft/mimalloc/archive/refs/tags/v3.3.2.tar.gz -o /tmp/mimalloc.tar.gz
          echo "ca02384e007f46950598500dfaebde5ff9948c1d231f5a81b058799afa64bbbb  /tmp/mimalloc.tar.gz" | sha256sum -c -
          tar xzf /tmp/mimalloc.tar.gz -C /tmp
          cmake -S /tmp/mimalloc-3.3.2 -B /tmp/mimalloc-build -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_SHARED=OFF -DMI_BUILD_STATIC=ON -DMI_BUILD_TESTS=OFF -DMI_LOCAL_DYNAMIC_TLS=ON
          cmake --build /tmp/mimalloc-build --target mimalloc-static --parallel
          static_library=$(find /tmp/mimalloc-build -name 'libmimalloc*.a' -type f | head -1)
          test -n "$static_library"
          sudo install -m 0644 "$static_library" /usr/local/lib/libmimalloc.a
          sudo install -m 0644 /tmp/mimalloc-3.3.2/include/mimalloc.h /usr/local/include/mimalloc.h

      - name: 'Run JVM fuzzing campaign'
        run: >-
          ./gradlew :selekt-jdbc:jvmFuzz
          -Pselekt.fuzz.profile="$FUZZ_PROFILE"
          -x integrationTest

      - name: 'Archive JVM fuzzing failures'
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jvm-fuzz-failures
          path: |
            selekt-jdbc/build/crash-*
            selekt-jdbc/build/Crash_*
            selekt-jdbc/build/test-results/jvmFuzz*
            selekt-jdbc/build/reports/tests/jvmFuzz*
          if-no-files-found: ignore
          retention-days: 14
