name: 'Benchmarks'

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jmh:
    name: 'JMH Benchmarks'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      deployments: write
    steps:
      - name: 'Install system packages'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc jq make sed tcl

      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: 'Setup Java 11'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 11

      - name: 'Setup Java 17'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17

      - name: 'Setup Java 25'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 25

      - name: 'Set JAVA_HOME'
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV

      - name: 'Cache mimalloc'
        id: cache-mimalloc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /usr/local/lib/libmimalloc.a
            /usr/local/include/mimalloc.h
          key: mimalloc-benchmarks-linux-amd64-v3.3.2

      - name: 'Build mimalloc'
        if: steps.cache-mimalloc.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -L https://github.com/microsoft/mimalloc/archive/refs/tags/v3.3.2.tar.gz -o mimalloc.tar.gz
          echo "ca02384e007f46950598500dfaebde5ff9948c1d231f5a81b058799afa64bbbb  mimalloc.tar.gz" | sha256sum -c -
          tar xzf mimalloc.tar.gz
          cd mimalloc-3.3.2
          mkdir -p out/release
          cd out/release
          cmake ../.. -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_SHARED=OFF -DMI_BUILD_STATIC=ON -DMI_BUILD_TESTS=OFF -DMI_LOCAL_DYNAMIC_TLS=ON
          make -j$(nproc) mimalloc-static
          sudo mkdir -p /usr/local/lib /usr/local/include
          STATIC_LIB=""
          for candidate in libmimalloc.a libmimalloc-static.a; do
            if [ -f "$candidate" ]; then STATIC_LIB="$candidate"; break; fi
          done
          if [ -z "$STATIC_LIB" ]; then
            echo "ERROR: no mimalloc static lib produced. Build dir contents:"
            ls -la
            exit 1
          fi
          sudo cp "$STATIC_LIB" /usr/local/lib/libmimalloc.a
          sudo cp ../../include/mimalloc.h /usr/local/include/mimalloc.h

      - name: 'Configure Gradle'
        run: |
          echo 'org.gradle.caching=false' >> gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties

      - name: 'Prepare RAM-backed benchmark storage'
        run: mkdir -p /dev/shm/selekt-jmh

      - name: 'Run Java 25 JDBC batch-insert benchmarks'
        run: ./gradlew :selekt-jdbc:jmhFfm -Pjmh.includes="JdbcBatchBenchmark\..*BatchInsert" -Pjmh.profilers=gc -Pjmh.params="batchSize=1000" -Pjmh.tempDirectory=/dev/shm/selekt-jmh

      - name: 'Preserve Java 25 batch-insert results'
        run: cp selekt-jdbc/build/results/jmhFfm/results.json /tmp/jdbc-batch-java25-results.json

      - name: 'Run Java 11 JNI batch-insert benchmarks'
        run: ./gradlew :selekt-jdbc:jmhJni -Pjmh.includes="JdbcBatchBenchmark\.selekt.*BatchInsert" -Pjmh.profilers=gc -Pjmh.params="batchSize=1000" -Pjmh.tempDirectory=/dev/shm/selekt-jmh

      - name: 'Label Java 11 JNI batch-insert results'
        run: |
          jq 'map(
            (.benchmark | split(".")) as $parts |
            .benchmark = (
              ($parts[0:-1] + [($parts[-1] | sub("^selekt"; "selektJni"))]) |
              join(".")
            )
          )' \
            selekt-jdbc/build/results/jmhJni/results.json \
            > /tmp/jdbc-batch-java11-results.json

      - name: 'Run Java 25 JDBC text-stream benchmarks'
        run: ./gradlew :selekt-jdbc:jmhFfm -Pjmh.includes="JdbcStringStreamBenchmark\.(readAsciiStream|readCharacterStream)" -Pjmh.profilers=gc -Pjmh.params="driverKind=SELEKT,XERIAL;rowCount=50000;stringEncoding=ASCII,LATIN1,UTF16;valueSizeBytes=16"

      - name: 'Normalise Java 25 text-stream benchmark names'
        run: |
          jq 'map(
            if (.benchmark | contains(".JdbcStringStreamBenchmark.")) then
              (.benchmark | split(".") | .[0:-1] | join(".")) as $class |
              (.benchmark | split(".") | last) as $method |
              .benchmark = (
                $class + "." +
                (.params.driverKind | ascii_downcase) +
                (if $method == "readAsciiStream" then "AsciiStream" else "CharacterStream" end) +
                .params.stringEncoding
              ) |
              del(.params)
            else
              .
            end
          )' selekt-jdbc/build/results/jmhFfm/results.json > /tmp/jdbc-stream-java25-results.json

      - name: 'Run Java 11 JNI text-stream benchmarks'
        run: ./gradlew :selekt-jdbc:jmhJni -Pjmh.includes="JdbcStringStreamBenchmark\.(readAsciiStream|readCharacterStream)" -Pjmh.profilers=gc -Pjmh.params="driverKind=SELEKT;rowCount=50000;stringEncoding=ASCII,LATIN1,UTF16;valueSizeBytes=16"

      - name: 'Normalise Java 11 JNI text-stream benchmark names'
        run: |
          jq 'map(
            if (.benchmark | contains(".JdbcStringStreamBenchmark.")) then
              (.benchmark | split(".") | .[0:-1] | join(".")) as $class |
              (.benchmark | split(".") | last) as $method |
              .benchmark = (
                $class + ".selektJni" +
                (if $method == "readAsciiStream" then "AsciiStream" else "CharacterStream" end) +
                .params.stringEncoding
              ) |
              del(.params)
            else
              .
            end
          )' selekt-jdbc/build/results/jmhJni/results.json > /tmp/jdbc-stream-java11-results.json

      - name: 'Merge results'
        run: |
          jq -s 'add' \
            /tmp/jdbc-batch-java25-results.json \
            /tmp/jdbc-batch-java11-results.json \
            /tmp/jdbc-stream-java25-results.json \
            /tmp/jdbc-stream-java11-results.json \
            > /tmp/combined-results.json

      - name: 'Extract GC allocation metrics'
        run: |
          jq '[.[] | . as $orig |
            ($orig.secondaryMetrics | to_entries[] | select(.key | endswith("gc.alloc.rate.norm")) | .value) as $alloc |
            ($orig | del(.secondaryMetrics) | .primaryMetric = ($alloc + {scoreUnit: "B/op"}) | .secondaryMetrics = {})
          ]' /tmp/combined-results.json > /tmp/combined-alloc-results.json
          echo "Allocation entries: $(jq length /tmp/combined-alloc-results.json)"
          jq '.[0] | {benchmark, mode, forks, scoreUnit: .primaryMetric.scoreUnit, score: .primaryMetric.score}' /tmp/combined-alloc-results.json

      - name: 'Validate results'
        run: |
          for f in /tmp/combined-results.json /tmp/combined-alloc-results.json; do
            jq 'length' "$f"
            if jq -e '[.[] | select(.benchmark == null)] | length > 0' "$f" > /dev/null 2>&1; then
              echo "::error::Found entries with null benchmark field in $f"
              jq '[.[] | select(.benchmark == null)]' "$f"
              exit 1
            fi
          done

      - name: 'Restore working tree'
        run: git checkout -- .

      - name: 'Store benchmark results'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: 'JDBC Benchmarks'
          tool: 'jmh'
          output-file-path: /tmp/combined-results.json
          benchmark-data-dir-path: benchmarks/jmh
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      - name: 'Store allocation results'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: 'JDBC Allocations'
          tool: 'jmh'
          output-file-path: /tmp/combined-alloc-results.json
          benchmark-data-dir-path: benchmarks/jmh-alloc
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false

      - name: 'Upload raw results'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: 'JMH Results'
          path: |
            /tmp/jdbc-*-results.json
            /tmp/combined-results.json
            /tmp/combined-alloc-results.json
